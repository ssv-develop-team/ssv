# SSV 运行配置模板。
# 复制为 config/ssv.yaml 后修改；不会自动加载本文件。
# 配置角色、路径和 RTSP 用法见 docs/运行与配置.md。
# 临时环境变量：REDIS_HOST、REDIS_PORT、SSV_RTSP_URL、GST_DEBUG。

version: "2.0"

logging:
  cpp_debug_level: "ssv*:4"
  python_log_level: "INFO"

redis:
  host: "localhost"
  port: 6379
  db: 0
  stream_key: "ssv:events"
  consumer_group: "ssv-agent"
  reclaim_idle_ms: 60000
  reclaim_batch_size: 10
  consumer_name: null

# SSV 短时证据缓存；directory 必须是 SSV 与 Agent 共享的绝对路径，且位于 evidence_roots 内。
evidence_cache:
  directory: "/var/lib/ssv/evidence-cache"
  segment_duration_ms: 10000
  retention_ms: 120000
  max_bytes_mb: 512

# 当前契约：一个 H.264 8-bit RTSP source。
sources:
  - id: "camera-01"
    uri: "rtsp://localhost:8554/test"
    codec: "h264"
    protocols: "tcp"
    latency_ms: 200
    decode:
      mode: "auto"
      device: "auto"

display:
  enabled: true
  backend: "auto"
  rtsp:
    location: "rtsp://127.0.0.1:8554/ssv"
    burn_in_overlay: false
    encoded_passthrough: false
  fps: 30
  gl_backend: "auto"
  overlay:
    enabled: true
    font:
      face: "regular"
      size: 12
    motion_prediction:
      enabled: true
      max_horizon_ms: 300

inference:
  enabled: true
  analysis_fps: 15
  model:
    path: "models/yolov8n.onnx"
    family: "yolo"
    output_format: "yolov8"
    label_map: "config/model-labels/coco80.txt"
    preprocess:
      color_order: "rgb"
      resize: "letterbox"
      execution: "auto"
      normalization:
        scale: 0.00392156862745098
        mean: [0.0, 0.0, 0.0]
        std: [1.0, 1.0, 1.0]
  runtime:
    type: "onnxruntime"
    providers:
      mode: "auto"
    device_id: 0
    precision: "auto"
    cpu_threads: "auto"
    cache:
      enabled: true
      directory: ""
  confidence_threshold: 0.5
  target_class: "person"

tracking:
  enabled: true
  track_threshold: 0.5
  track_buffer: 30
  match_threshold: 0.3
  mock_track: false
  publish_cooldown_ms: 30000
  gmc:
    method: "sparse-opt-flow"
    downscale: 2

agent:
  state_machine_timeout: 300
  max_retries: 3
  event_db_path: "data/events.db"
  output_dir: "outputs"
  dedup_enabled: true
  dedup_cooldown_seconds: 30.0
  # 证据根必须是绝对路径；空列表表示 fail closed。
  evidence_roots:
    - "/var/lib/ssv/evidence-cache"
  recording_evidence:
    poll_interval_ms: 1000
    lease_ms: 30000
    max_retries: 3
    retry_delay_ms: 2000
    clip_before_ms: 2500
    clip_after_ms: 2500
    merge_gap_ms: 3000
    lost_grace_ms: 3000
    silence_timeout_ms: 30000
    max_episode_ms: 30000
  review:
    enabled: false
    poll_interval_ms: 1000
    lease_ms: 30000
    max_retries: 3
    retry_delay_ms: 1000
    policy_id: "ssv-review.v1"
    model_id: null
  indexing:
    enabled: false
    poll_interval_ms: 1000
    lease_ms: 30000
    max_retries: 3
    retry_delay_ms: 1000
    embedding_backend: "mock"
    embedding_model: null
    embedding_base_url: null
    query_text_type: null
  reporting:
    enabled: true
    poll_interval_ms: 1000
    lease_ms: 30000
    max_retries: 3
    retry_delay_ms: 1000
  knowledge:
    backend: "local_markdown"
    rules_dir: "knowledge/rules"
    qdrant_path: "data/qdrant"
    qdrant_url: "http://localhost:6333"
    min_score: 0.5
